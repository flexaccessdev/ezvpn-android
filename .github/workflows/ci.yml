name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: tunnelcore unit tests
        run: ./gradlew :tunnelcore:test --console=plain

      # The APK needs a jniLibs tree. Until a release with the pinned sha256
      # exists, point the build at an empty local tree (the .so is loaded at
      # runtime only, so the build and the JVM tests do not need it).
      - name: Stage jniLibs
        run: |
          if grep -qE '^ezvpn.releaseSha256=[0-9a-f]{64}$' gradle.properties; then
            echo "EZVPN_LOCAL_JNILIBS=" >> "$GITHUB_ENV"
          else
            mkdir -p ../ezvpn/dist/android/jniLibs
            echo "EZVPN_LOCAL_JNILIBS=1" >> "$GITHUB_ENV"
          fi

      - name: App unit tests + debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
